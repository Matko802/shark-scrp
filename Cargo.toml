[package]
name = "shark-scrp"
version = "1.1.0"
edition = "2021"
description = "shark-scrp - GTK4 compressor + TikTok slideshow + yt-dlp downloader"
license = "MIT"

[[bin]]
name = "shark-scrp"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gio = { version = "0.20" }
glib = { version = "0.20" }
gdk4 = { version = "0.9" }
gdk-pixbuf = { version = "0.20" }

tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
image = { version = "0.25", features = ["jpeg", "png"] }
imageproc = "0.25"
tempfile = "3.10"
anyhow = "1.0"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2.5"
dirs = "5.0"
which = "6.0"
humansize = "2.1"
mime_guess = "2.0"
num_cpus = "1.16"
rfd = { version = "0.15" }
open = "5.3"
