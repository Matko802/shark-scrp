[project]
name = "tiktok-slideshow-downloader"
version = "1.0.0"
description = "TikTok slideshow downloader that converts photo slideshows to video with authentic swipe animation and original music. No loop."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.8",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]
optional-dependencies = { "ytdlp" = ["yt-dlp>=2023.0.0"] }

[project.scripts]
tiktok-slideshow = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
